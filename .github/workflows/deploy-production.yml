name: Deploy production

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: https://lingering-butterfly-9ba8.jaffakakes28.workers.dev
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_NOTIFY_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the prod GitHub environment before deploying."
            exit 1
          fi
          if [ -z "$RELEASE_NOTIFY_TOKEN" ]; then
            echo "::error::Add RELEASE_NOTIFY_TOKEN to the prod GitHub environment before deploying."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run check:language:format
      - run: npm run check:language
      - run: npm run build
      - run: npm run check
      - run: npm run check:editor
      - name: Deploy verified build to Cloudflare
        run: npm run deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_NOTIFY_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
