name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run check:language:format
      - run: npm run check:language
      - run: npm run build
      - run: npm run check
      - run: npm run check:editor
      - run: npx playwright-core install --with-deps chromium
      - name: Configure browser executable
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { chromium } from "playwright-core"; appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${chromium.executablePath()}\n`);'
      - run: npm run check:browser:smoke

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify Windows auth, session restoration and subprocess cleanup
        run: node --test tests/editor-session-restore.test.mjs tests/local-supabase-auth.test.mjs tests/native-mfa-sidecar.test.mjs tests/server/local-reply-repository.test.mjs
