<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Play an interactive PVO video." />
    <meta name="theme-color" content="#000000" />
    <title>PVO Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="empty-state" id="emptyState">
        <div class="drop-zone" id="dropZone">
          <h1>Open a PVO</h1>
          <label class="open-button"><input id="pvoInput" type="file" accept=".pvo,application/vnd.pvo" />Choose a PVO</label>
          <span>or drop it here</span>
        </div>
      </section>

      <section class="player-shell" id="playerShell" hidden>
        <div class="player-frame controls-visible" id="playerFrame">
          <video id="video" playsinline preload="auto"></video>
          <div class="overlay-layer" id="overlayLayer"></div>
          <button class="center-play" id="centerPlayButton" type="button" aria-label="Play" hidden>▶</button>

          <div class="player-topbar">
            <span class="player-brand">PVO</span>
          </div>

          <div class="end-screen" id="endScreen" hidden>
            <div class="end-card">
              <span class="end-eyebrow">PVO</span>
              <h1>Playback complete</h1>
              <button class="restart-experience" id="endRestartButton" type="button">Watch again</button>
            </div>
          </div>

          <div class="player-controls" id="playerControls">
            <input class="progress-control" id="progress" type="range" min="0" max="1" value="0" step="0.01" aria-label="Video progress" />
            <div class="control-row">
              <button class="control-button" id="playButton" type="button" aria-label="Play">▶</button>
              <span class="time-label" id="timeLabel">00:00 / 00:00</span>
              <span id="timelineLabel" hidden>Main timeline</span>
              <span class="control-spacer"></span>
              <button class="control-button" id="muteButton" type="button" aria-label="Unmute">🔇</button>
              <input class="volume-control" id="volumeControl" type="range" min="0" max="1" value="1" step="0.05" aria-label="Volume" />
              <button class="control-button restart-button" id="restartButton" type="button" aria-label="Restart">↻</button>
              <button class="control-button fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter full screen">⛶</button>
            </div>
          </div>

          <p class="player-status" id="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
