[package]
name = "pvo-language"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Parser and structural validator for PVO component language."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
