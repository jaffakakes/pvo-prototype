<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Play an interactive PVO video." />
    <meta name="theme-color" content="#000000" />
    <title>Restyle Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="empty-state" id="emptyState">
        <div class="drop-zone" id="dropZone">
          <h1>Open a PVO</h1>
          <label class="open-button"><input id="pvoInput" type="file" accept=".pvo,application/vnd.pvo" />Choose a PVO</label>
          <span>or drop it here</span>
          <p class="open-status" id="openStatus" role="status" hidden></p>
          <details class="open-error-details" id="openErrorDetails" hidden>
            <summary>Details</summary>
            <p id="openErrorMessage"></p>
          </details>
        </div>
      </section>

      <section class="player-shell" id="playerShell" hidden></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
