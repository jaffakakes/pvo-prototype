<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open and play a self-contained PVO interactive video." />
    <title>PVO Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="app-title" href="/player/">PVO Player</a>
      <p id="fileSummary">No PVO open</p>
      <nav aria-label="PVO tools"><a href="/editor/">Editor</a><label class="button file-button"><input id="pvoInput" type="file" accept=".pvo,application/vnd.pvo" />Open .pvo</label></nav>
    </header>

    <main>
      <section class="empty-state" id="emptyState">
        <div class="drop-zone" id="dropZone">
          <h1>Open a PVO</h1>
          <p>Choose a self-contained <code>.pvo</code> file exported from the editor.</p>
          <label class="button primary file-button"><input id="startInput" type="file" accept=".pvo,application/vnd.pvo" />Choose .pvo file</label>
          <span>or drop it here</span>
        </div>
      </section>

      <section class="player-shell" id="playerShell" hidden>
        <div class="player-frame" id="playerFrame">
          <video id="video" playsinline preload="auto"></video>
          <div class="overlay-layer" id="overlayLayer"></div>
          <div class="end-screen" id="endScreen" hidden>
            <strong>Playback ended</strong>
            <button class="button primary" id="endRestartButton" type="button">Restart experience</button>
          </div>
        </div>

        <div class="player-controls">
          <button class="button" id="playButton" type="button">Play</button>
          <div class="progress-block">
            <progress id="progress" max="1" value="0"></progress>
            <div><span id="timelineLabel">Main timeline</span><span id="timeLabel">00:00 / 00:00</span></div>
          </div>
          <button class="button" id="restartButton" type="button">Restart</button>
        </div>
        <p class="player-status" id="status" aria-live="polite">Ready</p>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
